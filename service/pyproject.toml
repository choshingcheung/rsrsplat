[project]
name = "rsrsplat-service"
version = "0.1.0"
description = "Physics service for rsrsplat: articulation schemas, MJCF generation, and a MuJoCo session streamed over a WebSocket."
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "numpy>=1.26",
    "mujoco>=3.2",
    "plyfile>=1.0",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "websockets>=13.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# protocol.py uses typing.Union deliberately: the seam test introspects the discriminated
# union with typing.get_origin, which reports types.UnionType for `X | Y` and would need a
# second code path. The contract file is the wrong place to be clever.
"app/protocol.py" = ["UP007"]
